langchain-openai = "^0.3.35"
boto3 = "^1.40.49"
botocore = "^1.40.49"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
jupyter = "^1.1.1"
