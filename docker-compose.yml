version: '3.8'

services:
  rag-shop:
    image: prod.easy-profiler.org:1443/rag_shop:latest  # Имя и тег образа
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
    container_name: rag-shop
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8511}:8501"
    env_file:
      - .env
    volumes:
      # Монтируем данные, чтобы они сохранялись между перезапусками
      - ./data:/app/data
      # Опционально: монтируем код для разработки (можно закомментировать в продакшене)
      # - .:/app
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import streamlit; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
